# repopull configuration (first-run template).
# The GUI's Settings page writes your watched folder here, or set it by hand
# and restart.
# root = "/path/to/your/repositories"

max_depth = 2
ignore = []
fetch_timeout_s = 300
command_timeout_s = 120
delay_between_repos_s = 0.5
update_submodules = true
require_git_lfs_for_lfs_repos = true
log_dir = "logs"
