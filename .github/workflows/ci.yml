name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.python-version }})
    # ubuntu-latest is moving from 24.04 to 26.04 between 2026-10-19 and
    # 2026-11-19, so the same commit can land on either image. The 26.04 image
    # also fails to resolve Canonical's apt mirrors intermittently, which killed
    # the Qt library step twice in a row. Pin the LTS we test on; the app only
    # needs Python 3.11+ and git, so the newer image buys nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor in pyproject.toml; 3.13 is the interpreter
        # the AppImage ships. Both must pass, so a floor bump needs green CI.
        python-version: ["3.11", "3.13"]
    steps:
      # Actions are pinned to a commit SHA with the release tag in a comment.
      # A tag is a pointer its owner can move; a SHA cannot, so a compromised
      # tag cannot swap code into this workflow. Dependabot (dependabot.yml)
      # rewrites both the SHA and the comment.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config where a
          # later step could read it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # A changed pin must miss the cache, not reuse the old wheel.
          cache-dependency-path: |
            pyproject.toml
            packaging/ci-requirements.txt
            packaging/runtime-requirements.txt

      - name: Install Qt system libraries
        # Qt6Gui links libEGL/libGL at load time even for the offscreen
        # platform, and libegl1 is the one package the runner image lacks.
        # Short timeouts keep a mirror outage from eating thirteen minutes.
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install project and test tools
        # The constraint file pins PySide6 to the version the image ships, so
        # both legs exercise the binding users actually run rather than
        # whatever 6.x is newest. Widening the supported range in
        # pyproject.toml needs a manual check against the oldest minor.
        run: |
          python -m pip install -e '.[gui]' \
            -c packaging/runtime-requirements.txt \
            -r packaging/ci-requirements.txt

      - name: Audit packaging dependencies
        run: |
          pip-audit -r packaging/runtime-requirements.txt
          pip-audit -r packaging/build-requirements.txt

      - name: Run make check
        run: make check
