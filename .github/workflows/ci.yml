name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor in pyproject.toml; 3.13 is the interpreter
        # the AppImage ships. Both must pass, so a floor bump needs green CI.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gui]' mypy

      - name: Audit packaging dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r packaging/runtime-requirements.txt
          pip-audit -r packaging/build-requirements.txt

      - name: Run make check
        run: make check
