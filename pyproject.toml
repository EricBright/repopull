[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repopull"
version = "0.8.1"
description = "Keep local mirrors of watched third-party repositories current with their remotes."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Eric Bright" }]
keywords = ["git", "mirror", "pull", "repository", "sync"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/EricBright/repopull"
Issues = "https://github.com/EricBright/repopull/issues"
Changelog = "https://github.com/EricBright/repopull/blob/main/CHANGELOG.md"

[project.scripts]
repopull = "repopull.cli:main"
repopull-gui = "repopull.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repopull.gui" = ["assets/*.png"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/repopull"]
mypy_path = "src"
warn_unreachable = true

# PySide6 ships .pyi files without a py.typed marker, so mypy treats the
# bindings as untyped. The GUI is still annotated; these two leniencies keep
# Qt's Any-typed base classes from failing the strict run.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["repopull.gui.*"]
disallow_subclassing_any = false
